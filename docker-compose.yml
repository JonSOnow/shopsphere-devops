
services:
  shopsphere:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopsphere:compose
    expose:
      - "5000"
    environment:
      INSTANCE_PATH: /app/instance
      SECRET_KEY: local-development-key-change-later
    volumes:
      - shopsphere_data:/app/instance
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shopsphere
    restart: unless-stopped

volumes:
  shopsphere_data:
